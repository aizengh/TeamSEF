<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEAM SEF Live Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --deep:#030a24; --blue:#2f6bff; --sky:#6fa8ff; --cyan:#5ad1ff; --ice:#e8f2ff; --gold:#e8c46a; --gold2:#fff1b8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--deep);overflow:hidden}
.wrap{width:100vw;height:100%;container-type:size}
.stage{--u:min(1cqw,2.1cqh);position:relative;width:100%;height:100%;overflow:hidden;
  background:radial-gradient(90% 80% at 30% 45%,#123a9e 0%,#0a2272 40%,var(--deep) 100%);
  font-family:"Orbitron","Segoe UI",Arial,sans-serif}

/* background layers */
.glow{position:absolute;border-radius:50%;filter:blur(9cqmin);mix-blend-mode:screen;opacity:.5}
.g1{width:60%;height:80%;left:-8%;top:10%;background:radial-gradient(circle,#2f6bff,transparent 65%);animation:drift 12s ease-in-out infinite alternate}
.g2{width:50%;height:70%;right:-10%;top:-15%;background:radial-gradient(circle,#2fb8ff,transparent 65%);opacity:.35;animation:drift 16s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(10%,8%) scale(1.2)}}
.g3{width:38%;height:50%;right:2%;bottom:-12%;background:radial-gradient(circle,#e8c46a,transparent 65%);opacity:.32;animation:drift 20s ease-in-out infinite alternate}
.stage::before,.stage::after{content:"";position:absolute;left:0;right:0;height:max(2px,.7cqmin);z-index:3;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.85;box-shadow:0 0 1.5cqmin var(--gold)}
.stage::before{top:0}.stage::after{bottom:0}
.grid{position:absolute;left:-60%;right:-60%;bottom:-2%;height:55%;transform-origin:50% 100%;transform:perspective(50cqmin) rotateX(62deg);
  background:
   linear-gradient(rgba(90,170,255,.55) 1px,transparent 1px) 0 0/100% 6cqmin,
   linear-gradient(90deg,rgba(90,170,255,.55) 1px,transparent 1px) 0 0/6cqmin 100%;
  -webkit-mask-image:linear-gradient(transparent,#000 85%);mask-image:linear-gradient(transparent,#000 85%);
  animation:gridmove 3s linear infinite;opacity:.55}
@keyframes gridmove{to{background-position:0 6cqmin,6cqmin 0}}
.streak{position:absolute;left:-40%;height:.25cqmin;width:40%;border-radius:1cqmin;
  background:linear-gradient(90deg,transparent,rgba(120,200,255,.95),transparent);filter:blur(.1cqmin);opacity:0;animation:streak 6s ease-in infinite}
.s1{top:22%}.s2{top:68%;animation-delay:2.2s;animation-duration:7s}.s3{top:44%;animation-delay:4s;animation-duration:8s}
.s2{background:linear-gradient(90deg,transparent,rgba(255,225,140,.95),transparent)}
@keyframes streak{0%{left:-40%;opacity:0}10%{opacity:1}60%{opacity:.8}100%{left:110%;opacity:0}}
#fx{position:absolute;inset:0;width:100%;height:100%}
.vig{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(2,6,26,.75));pointer-events:none}

/* content area scales to any ratio */
.content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5cqmin;padding:0 4cqw;
  animation:intro 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes intro{from{opacity:0;transform:scale(.92);filter:blur(12px)}}

/* logo HUD */
.logo{position:relative;flex:none;--s:min(90cqh,40cqw);width:var(--s);height:var(--s);font-size:calc(var(--s)/38);animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.2em)}}
.logo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{fill:none;transform-origin:50% 50%}
.r1{stroke:rgba(150,200,255,.6);stroke-width:.35;stroke-dasharray:.6 1.9;animation:spin 70s linear infinite}
.r2{stroke:var(--cyan);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:70 270;filter:drop-shadow(0 0 .7em var(--cyan));animation:spin 6s linear infinite}
.r3{stroke:var(--gold);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:55 285;filter:drop-shadow(0 0 .7em var(--gold));animation:spin 9s linear infinite reverse}
.r5{stroke:rgba(232,196,106,.8);stroke-width:.7;filter:drop-shadow(0 0 .5em var(--gold))}
.r4{stroke:rgba(232,196,106,.75);stroke-width:.5;stroke-dasharray:6 4;animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.radar{position:absolute;inset:2em;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(90,209,255,.55),rgba(90,209,255,0) 22%,transparent);
  animation:spin 4.5s linear infinite;
  -webkit-mask-image:radial-gradient(circle,transparent 62%,#000 63%,#000 100%);mask-image:radial-gradient(circle,transparent 62%,#000 63%,#000 100%);opacity:.7}
.orbit{position:absolute;inset:-1.2em;animation:spin 8s linear infinite}
.orbit i{position:absolute;left:50%;top:0;width:1em;height:1em;margin-left:-.5em;border-radius:50%;background:#fff;box-shadow:0 0 1.6em .5em var(--gold)}
.disc{position:absolute;inset:4.6em;border-radius:50%;overflow:hidden;border:.6em solid transparent;
  background:linear-gradient(#0a1f55,#0a1f55) padding-box,linear-gradient(140deg,var(--gold2),var(--gold) 30%,var(--cyan) 62%,var(--blue)) border-box;
  box-shadow:0 0 5em rgba(47,120,255,.9),0 0 1.2em rgba(232,196,106,.55),inset 0 0 3em rgba(0,10,60,.8);animation:pulse 3s ease-in-out infinite}
.disc img{width:100%;height:100%;object-fit:cover;display:block;animation:breathe 7s ease-in-out infinite}
.disc::after{content:"";position:absolute;top:-20%;bottom:-20%;width:28%;left:-50%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,55%{left:-50%}100%{left:130%}}
@keyframes breathe{50%{transform:scale(1.07)}}
@keyframes pulse{50%{box-shadow:0 0 8em rgba(90,170,255,1),inset 0 0 3em rgba(0,10,60,.8)}}

/* crystals */
.cube{position:absolute;opacity:.7;animation:float 8s ease-in-out infinite}
.cube svg{width:100%;display:block;filter:drop-shadow(0 0 1em rgba(90,170,255,.7))}
.c1{left:36%;top:5%;width:11cqmin}.c2{right:2%;top:8%;width:15cqmin;animation-delay:-3s}.c3{right:12%;bottom:6%;width:12cqmin;animation-delay:-5s}
@keyframes float{50%{transform:translateY(-2em) rotate(8deg)}}
.c3 g{fill:rgba(232,196,106,.14);stroke:rgba(245,220,150,.75)}

/* text card */
.card{position:relative;flex:1 1 0;min-width:0;--fs:min(80cqh,26cqw);--ch:min(66cqh,22cqw);height:var(--ch);max-width:calc(var(--ch)*4.1);font-size:calc(var(--ch)/17.5);border-radius:.35em;
  background:linear-gradient(135deg,rgba(8,32,110,.93),rgba(3,10,52,.95));
  -webkit-backdrop-filter:blur(.8em);backdrop-filter:blur(.8em);
  box-shadow:inset 0 0 0 .22em var(--gold),inset 0 0 0 .6em rgba(3,10,52,.95),inset 0 0 0 .68em rgba(232,196,106,.4),0 0 3em rgba(40,110,255,.55),0 0 1.4em rgba(232,196,106,.5);overflow:hidden}
.card::before{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(150,210,255,.22),transparent);animation:shine 5s ease-in-out infinite}
.br{position:absolute;width:3em;height:3em;border:0 solid var(--gold);filter:drop-shadow(0 0 .5em var(--gold))}
.br.tl{left:1.1em;top:1.1em;border-width:.3em 0 0 .3em}.br.tr{right:1.1em;top:1.1em;border-width:.3em .3em 0 0}
.br.bl{left:1.1em;bottom:1.1em;border-width:0 0 .3em .3em}.br.bb{right:1.1em;bottom:1.1em;border-width:0 .3em .3em 0}
.bar{position:absolute;left:6em;right:6em;bottom:1.3em;height:.3em;background:rgba(120,180,255,.2);border-radius:1em;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8862b,var(--gold),var(--gold2));box-shadow:0 0 1em var(--gold)}
.bar.go i{animation:fill var(--hold,4.5s) linear forwards}
@keyframes fill{to{width:100%}}

.slide{position:absolute;left:4.2em;right:4.2em;top:48%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:2.4em;visibility:hidden}
.slide.in,.slide.out{visibility:visible}
.ico{width:6.6em;flex:none;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 .8em var(--gold))}
.lines{flex:0 1 auto;min-width:0;max-width:100%;text-align:center}
.line{display:block;white-space:nowrap;font-weight:900;font-size:5.4em;line-height:1.35;letter-spacing:.12em;padding-left:.12em;width:max-content;margin-inline:auto;transform-origin:left center;
  filter:drop-shadow(0 .05em 0 rgba(2,8,40,1)) drop-shadow(.06em .08em 0 rgba(2,8,40,.95)) drop-shadow(0 0 .3em rgba(70,150,255,.9))}
@keyframes shimmer{to{background-position:-300% 0}}
.c{display:inline-block;white-space:pre;opacity:0;transform:translateY(.7em) scale(.85);filter:blur(.3em);
  color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-size:300% 100%;
  background-image:linear-gradient(110deg,#a9cfff 0 36%,#fff 44%,#ffe9a8 50%,#fff 56%,#a9cfff 64% 100%);
  animation:shimmer 3.4s linear infinite;animation-delay:calc(var(--i)*-130ms);
  transition:opacity .6s ease,transform .7s cubic-bezier(.2,.9,.2,1),filter .6s ease;transition-delay:calc(var(--i)*55ms)}
.in .c{opacity:1;transform:none;filter:none}
.out .c{opacity:0;transform:translateY(-.7em) scale(.9);filter:blur(.3em);transition-duration:.4s;transition-delay:calc(var(--i)*15ms)}
.c.n7{font-family:"Exo 2","Segoe UI",Arial,sans-serif;font-weight:900}
.ico{opacity:0;transform:rotate(-30deg) scale(.5);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.in .ico{opacity:1;transform:none}.out .ico{opacity:0;transition-duration:.4s}
/* cahaya pemisah di tepi atas */
.topglow{position:absolute;left:0;right:0;top:0;height:42%;pointer-events:none;
  background:linear-gradient(rgba(130,200,255,.6),rgba(70,140,255,.22) 40%,transparent);animation:tpulse 3.6s ease-in-out infinite}
.topglow::before{content:"";position:absolute;inset:0;
  background:radial-gradient(55% 100% at 50% 0%,rgba(255,236,180,.55),transparent 72%);animation:tsway 7s ease-in-out infinite alternate}
@keyframes tpulse{50%{opacity:.65}}
@keyframes tsway{from{transform:translateX(-22%)}to{transform:translateX(22%)}}
.seam{position:absolute;left:0;right:0;top:0;height:max(3px,.9cqmin);z-index:4;pointer-events:none;
  background:linear-gradient(90deg,rgba(232,196,106,.35),#fff6d0 50%,rgba(232,196,106,.35));
  box-shadow:0 0 2.2cqmin .4cqmin rgba(255,225,140,.85),0 0 7cqmin rgba(80,160,255,.8)}
.seam::after{content:"";position:absolute;top:-80%;bottom:-80%;width:16%;left:-20%;
  background:linear-gradient(90deg,transparent,#fff,transparent);filter:blur(2px);animation:seamrun 3.4s ease-in-out infinite}
@keyframes seamrun{0%{left:-20%}100%{left:105%}}
/* aksen emas tambahan */
.side{position:absolute;top:14%;bottom:14%;width:.7em;background:linear-gradient(var(--gold2),var(--gold) 50%,#a87a22);box-shadow:0 0 1.2em var(--gold)}
.side.l{left:0;border-radius:0 .3em .3em 0}.side.r{right:0;border-radius:.3em 0 0 .3em}
.gem{position:absolute;left:50%;width:1.1em;height:1.1em;margin-left:-.55em;transform:rotate(45deg);
  background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#a87a22);box-shadow:0 0 1em var(--gold)}
.gem.t{top:.55em}.gem.b{bottom:.55em}
.lines::after{content:"";display:block;height:.24em;margin:.1em auto 0;width:0;border-radius:1em;
  background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);box-shadow:0 0 .8em var(--gold);
  transition:width .9s cubic-bezier(.2,.8,.2,1) .4s}
.in .lines::after{width:100%}.out .lines::after{width:0;transition-duration:.3s;transition-delay:0s}
@container (max-aspect-ratio:1/1){
  .content{flex-direction:column;padding:0}
  .logo{--s:min(44cqh,76cqw)}
  .card{flex:none;--fs:min(24cqh,46cqw);--ch:min(24cqh,46cqw);width:88cqw;max-width:none}
}
</style>
</head>
<body>
<div class="wrap"><div class="stage">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
  <div class="grid"></div>
  <div class="streak s1"></div><div class="streak s2"></div><div class="streak s3"></div>
  <canvas id="fx"></canvas>
  <div class="vig"></div>
  <div class="topglow"></div><div class="seam"></div>

  <div class="content">
    <div class="cube c1"><svg viewBox="0 0 100 100"><g fill="rgba(110,170,255,.16)" stroke="rgba(210,230,255,.65)" stroke-width="2"><polygon points="50,5 92,28 92,72 50,95 8,72 8,28"/><polyline points="8,28 50,50 92,28" fill="none"/><line x1="50" y1="50" x2="50" y2="95"/></g></svg></div>
    <div class="cube c2"><svg viewBox="0 0 100 100"><g fill="rgba(110,170,255,.16)" stroke="rgba(210,230,255,.65)" stroke-width="2"><polygon points="50,5 92,28 92,72 50,95 8,72 8,28"/><polyline points="8,28 50,50 92,28" fill="none"/><line x1="50" y1="50" x2="50" y2="95"/></g></svg></div>
    <div class="cube c3"><svg viewBox="0 0 100 100"><g fill="rgba(110,170,255,.16)" stroke="rgba(210,230,255,.65)" stroke-width="2"><polygon points="50,5 92,28 92,72 50,95 8,72 8,28"/><polyline points="8,28 50,50 92,28" fill="none"/><line x1="50" y1="50" x2="50" y2="95"/></g></svg></div>

    <div class="logo">
      <svg viewBox="0 0 100 100">
        <circle class="ring r1" cx="50" cy="50" r="52" pathLength="360"/>
        <circle class="ring r4" cx="50" cy="50" r="49.5" pathLength="100"/>
        <circle class="ring r5" cx="50" cy="50" r="43"/>
        <circle class="ring r2" cx="50" cy="50" r="47" pathLength="340"/>
        <circle class="ring r3" cx="50" cy="50" r="47" pathLength="340"/>
      </svg>
      <div class="radar"></div>
      <div class="orbit"><i></i></div>
      <div class="disc" id="disc"></div>
    </div>

    <div class="card" id="card">
      <span class="br tl"></span><span class="br tr"></span><span class="br bl"></span><span class="br bb"></span>
      <span class="side l"></span><span class="side r"></span><span class="gem t"></span><span class="gem b"></span>
      <div id="panel"></div>
      <div class="bar" id="bar"><i></i></div>
    </div>
  </div>
</div></div>

const LINK_ICON = '<svg class="ico" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>';

(function(){
  const img = new Image(); img.src = LOGO; img.alt = 'Team SEF';
  document.getElementById('disc').appendChild(img);

  const panel = document.getElementById('panel');
  const bar = document.getElementById('bar');
  bar.style.setProperty('--hold', CONFIG.holdSeconds + 's');

  const els = CONFIG.slides.map(s => {
    const d = document.createElement('div'); d.className = 'slide';
    if (s.icon === 'link') d.insertAdjacentHTML('beforeend', LINK_ICON);
    const box = document.createElement('div'); box.className = 'lines';
    s.lines.forEach(t => {
      const l = document.createElement('span'); l.className = 'line';
      for (const ch of t.replace(/\*/g, '')) {
        const e = document.createElement('span'); e.className = 'c' + (ch === '7' ? ' n7' : '');
        e.textContent = ch; e.style.setProperty('--i', l.children.length); l.appendChild(e);
      }
      box.appendChild(l);
    });
    d.appendChild(box); panel.appendChild(d); return d;
  });

  function fit(el){
    el.querySelectorAll('.line').forEach(l => {
      l.style.transform = 'none';
      const max = l.parentElement.clientWidth, w = l.scrollWidth;
      if (w > max && max > 0) l.style.transform = 'scale(' + (max / w) + ')';
    });
  }

  let n = 0;
  function step(){
    const cur = els[n]; fit(cur);
    cur.classList.remove('out'); void cur.offsetWidth; cur.classList.add('in');
    bar.classList.remove('go'); void bar.offsetWidth; bar.classList.add('go');
    setTimeout(() => {
      cur.classList.remove('in'); cur.classList.add('out');
      setTimeout(() => { cur.classList.remove('out'); n = (n + 1) % els.length; step(); }, 1000);
    }, CONFIG.holdSeconds * 1000);
  }
  if (els.length) {
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(step, 600));
    addEventListener('resize', () => els.forEach(fit));
  }

  /* jaringan partikel biru */
  const cv = document.getElementById('fx'), cx = cv.getContext('2d');
  let W, H; const N = 55, P = [];
  function size(){ const d = Math.min(devicePixelRatio || 1, 1.5); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d,0,0,d,0,0); }
  size(); addEventListener('resize', size);
  for (let i = 0; i < N; i++) P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6,g:Math.random()<.35});
  (function loop(){
    cx.clearRect(0,0,W,H);
    const D = Math.min(W,H) * .2;
    for (let i = 0; i < N; i++) {
      const a = P[i]; a.x += a.vx; a.y += a.vy;
      if (a.x < 0 || a.x > W) a.vx *= -1; if (a.y < 0 || a.y > H) a.vy *= -1;
      for (let j = i + 1; j < N; j++) {
        const b = P[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.sqrt(dx*dx + dy*dy);
        if (d < D) { cx.strokeStyle = 'rgba(110,180,255,' + (.28 * (1 - d / D)) + ')'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke(); }
      }
      cx.beginPath(); cx.arc(a.x, a.y, a.r, 0, 6.283); cx.fillStyle = a.g ? 'rgba(255,225,140,.95)' : 'rgba(190,225,255,.85)'; cx.shadowBlur = 8; cx.shadowColor = a.g ? '#e8c46a' : '#5ad1ff'; cx.fill(); cx.shadowBlur = 0;
    }
    requestAnimationFrame(loop);
  })();
})();
